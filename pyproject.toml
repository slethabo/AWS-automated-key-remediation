[project]
name = "key-remediation"
version = "0.2.0"
description = "Automated deactivation of compromised AWS IAM access keys"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = [
    "moto[iam]>=5.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
key-remediation = "key_remediation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
