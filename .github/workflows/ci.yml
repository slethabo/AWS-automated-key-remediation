name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match the AWS Lambda Python runtimes we deploy to.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest

  package:
    name: Build Lambda artifact
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # boto3 is provided by the Lambda runtime, so only our own code is zipped.
      - name: Zip src/
        run: |
          cd src
          zip -r ../key-remediation-lambda.zip . -x '*.pyc' -x '__pycache__/*'
      - uses: actions/upload-artifact@v4
        with:
          name: key-remediation-lambda
          path: key-remediation-lambda.zip
          retention-days: 14
